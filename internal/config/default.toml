# Althea settings
#
# Saving this file applies it at once. A mistake is reported in Althea and leaves that
# setting at its default; the settings screen edits this same file.

schema = 1

[general]
# "system" follows Windows; or "en", "pt-BR".
language = "system"
start_at_login = true
# Checks GitHub for new versions. Nothing else is ever sent (no telemetry).
check_updates = false

[theme]
# A theme by file name without .toml, from the themes folder or built in, or "system" to
# follow Windows between the light and the dark one below.
name = "system"
dark = "althea-dark"
light = "althea-light"

[hotkey]
# Shows and hides Althea: a combination such as "Alt+Space" or "Ctrl+Shift+Space",
# or "Win" for the Windows key on its own.
toggle = "Alt+Space"

[window]
# How long Althea remembers where you were while hidden; "0s" always opens at the start.
reset_after = "1m30s"

# Extensions keep their preferences in tables of their own, which "Extension Preferences"
# in Althea writes, as:
# [extensions."althea.weather"]
# units = "metric"
# Secrets, as API keys, are kept in Windows Credential Manager, never here.

# Any command can have a hotkey of its own, which "Hotkeys and Aliases" in Althea writes, as:
# [hotkey.commands]
# "althea.windows/left" = "Ctrl+Alt+Left"

# And an alias, one word that finds it first when typed in full, kept in the same place:
# [aliases]
# "althea.clipboard/history" = "cl"
