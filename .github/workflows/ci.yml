name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Format
        run: go tool -modfile=tools/go.mod golangci-lint fmt --diff ./...
      - name: Lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...
      - name: go mod tidy
        run: go mod tidy -diff

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1" # the race detector needs cgo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test with the race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Test tools
        run: go -C tools test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go tool -modfile=tools/go.mod govulncheck ./...

  build:
    name: Build (${{ matrix.goos }})
    strategy:
      matrix:
        goos: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.goos }} GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/althea
